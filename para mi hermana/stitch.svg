<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" width="220" height="300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Pequeño alienígena azul de orejas grandes saludando con una flor amarilla</title>
  <style>
    .bob   { animation: bob 2.4s ease-in-out infinite alternate; }
    .ear-l { transform-origin: 72px 98px;  animation: earL 3s ease-in-out infinite alternate; }
    .ear-r { transform-origin: 148px 98px; animation: earR 3s ease-in-out infinite alternate; }
    .arm-r { transform-origin: 152px 194px; animation: wave 1.1s ease-in-out infinite alternate; }
    .eye   { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
    @keyframes bob   { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @keyframes earL  { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }
    @keyframes earR  { from { transform: rotate(3deg); }  to { transform: rotate(-4deg); } }
    @keyframes wave  { from { transform: rotate(-14deg); } to { transform: rotate(12deg); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
    @media (prefers-reduced-motion: reduce) { .bob, .ear-l, .ear-r, .arm-r, .eye { animation: none; } }
  </style>
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b96f0"/><stop offset="1" stop-color="#3a72d8"/></linearGradient>
    <linearGradient id="gHead" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64a0f4"/><stop offset="1" stop-color="#4682e6"/></linearGradient>
    <linearGradient id="gEar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3f7be0"/><stop offset="1" stop-color="#5b96f0"/></linearGradient>
    <radialGradient id="gInner" cx=".5" cy=".7" r=".8"><stop offset="0" stop-color="#e9b0dd"/><stop offset="1" stop-color="#b783c9"/></radialGradient>
    <g id="mini">
      <g fill="#ffe14d" stroke="#f0b400" stroke-width=".8">
        <circle cx="0" cy="-8" r="5.4"/><circle cx="0" cy="-8" r="5.4" transform="rotate(45)"/>
        <circle cx="0" cy="-8" r="5.4" transform="rotate(90)"/><circle cx="0" cy="-8" r="5.4" transform="rotate(135)"/>
        <circle cx="0" cy="-8" r="5.4" transform="rotate(180)"/><circle cx="0" cy="-8" r="5.4" transform="rotate(225)"/>
        <circle cx="0" cy="-8" r="5.4" transform="rotate(270)"/><circle cx="0" cy="-8" r="5.4" transform="rotate(315)"/>
      </g>
      <circle r="6" fill="#8a4b17"/>
      <circle cx="-1.6" cy="-1.8" r="2" fill="#c98b3f" opacity=".8"/>
    </g>
  </defs>

  <!-- sombra en el suelo -->
  <ellipse cx="110" cy="284" rx="70" ry="8" fill="#000" opacity=".12"/>

  <g class="bob">
    <!-- orejas -->
    <g class="ear-l">
      <path d="M74 100 C40 98 12 72 6 20 C32 32 62 42 88 66 Z" fill="url(#gEar)" stroke="#2f5fc0" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M72 92 C48 88 26 68 17 38 C36 48 58 56 76 72 Z" fill="url(#gInner)"/>
    </g>
    <g class="ear-r">
      <path d="M146 100 C180 98 208 72 214 20 C188 32 158 42 132 66 Z" fill="url(#gEar)" stroke="#2f5fc0" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M148 92 C172 88 194 68 203 38 C184 48 162 56 144 72 Z" fill="url(#gInner)"/>
    </g>

    <!-- piernas / pies -->
    <ellipse cx="80" cy="268" rx="28" ry="15" fill="#3a72d8" stroke="#2f5fc0" stroke-width="1.6"/>
    <ellipse cx="140" cy="268" rx="28" ry="15" fill="#3a72d8" stroke="#2f5fc0" stroke-width="1.6"/>
    <g fill="#e6f1ff">
      <circle cx="66" cy="277" r="3.6"/><circle cx="79" cy="281" r="3.6"/><circle cx="92" cy="277" r="3.6"/>
      <circle cx="128" cy="277" r="3.6"/><circle cx="141" cy="281" r="3.6"/><circle cx="154" cy="277" r="3.6"/>
    </g>

    <!-- cuerpo -->
    <ellipse cx="110" cy="214" rx="50" ry="55" fill="url(#gBody)" stroke="#2f5fc0" stroke-width="1.6"/>
    <ellipse cx="110" cy="228" rx="32" ry="38" fill="#b4d7fb"/>
    <ellipse cx="102" cy="216" rx="12" ry="8" fill="#fff" opacity=".22" transform="rotate(-25 102 216)"/>

    <!-- brazo izquierdo con flor -->
    <g>
      <path d="M68 194 Q46 216 60 240" fill="none" stroke="#2f5fc0" stroke-width="25" stroke-linecap="round"/>
      <path d="M68 194 Q46 216 60 240" fill="none" stroke="#4682e6" stroke-width="21" stroke-linecap="round"/>
      <path d="M60 242 Q56 220 46 200" fill="none" stroke="#3aa35a" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M55 226 q-15 -3 -18 -14 q13 -1 18 14z" fill="#4dbb6b"/>
      <use href="#mini" transform="translate(44 192) scale(1.4)"/>
      <circle cx="60" cy="242" r="12.5" fill="#4682e6" stroke="#2f5fc0" stroke-width="1.6"/>
      <circle cx="54" cy="246" r="3" fill="#e6f1ff"/><circle cx="62" cy="249" r="3" fill="#e6f1ff"/>
    </g>

    <!-- brazo derecho saludando -->
    <g class="arm-r">
      <path d="M152 196 Q184 190 192 158" fill="none" stroke="#2f5fc0" stroke-width="25" stroke-linecap="round"/>
      <path d="M152 196 Q184 190 192 158" fill="none" stroke="#4682e6" stroke-width="21" stroke-linecap="round"/>
      <circle cx="192" cy="150" r="13.5" fill="#4682e6" stroke="#2f5fc0" stroke-width="1.6"/>
      <circle cx="184" cy="140" r="3" fill="#e6f1ff"/><circle cx="193" cy="137" r="3" fill="#e6f1ff"/><circle cx="201" cy="142" r="3" fill="#e6f1ff"/>
    </g>

    <!-- mechones de la cabeza -->
    <path d="M80 68 Q80 28 97 54 Q104 14 115 50 Q130 24 140 68 Z" fill="#4682e6" stroke="#2f5fc0" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- cabeza -->
    <ellipse cx="110" cy="108" rx="64" ry="55" fill="url(#gHead)" stroke="#2f5fc0" stroke-width="1.6"/>
    <path d="M99 64 Q110 57 121 64 Q117 88 110 97 Q103 88 99 64Z" fill="#8dbdf6" opacity=".7"/>
    <ellipse cx="110" cy="136" rx="42" ry="28" fill="#b4d7fb"/>

    <!-- mejillas -->
    <ellipse cx="62" cy="134" rx="9" ry="5.5" fill="#ff9ec4" opacity=".5"/>
    <ellipse cx="158" cy="134" rx="9" ry="5.5" fill="#ff9ec4" opacity=".5"/>

    <!-- ojos -->
    <g class="eye">
      <ellipse cx="80" cy="108" rx="14.5" ry="19.5" fill="#0f1633" transform="rotate(-10 80 108)"/>
      <circle cx="85" cy="100" r="5.4" fill="#fff"/><circle cx="76" cy="117" r="2.2" fill="#fff" opacity=".85"/>
    </g>
    <g class="eye">
      <ellipse cx="140" cy="108" rx="14.5" ry="19.5" fill="#0f1633" transform="rotate(10 140 108)"/>
      <circle cx="145" cy="100" r="5.4" fill="#fff"/><circle cx="136" cy="117" r="2.2" fill="#fff" opacity=".85"/>
    </g>

    <!-- nariz y boca -->
    <ellipse cx="110" cy="128" rx="12.5" ry="8.5" fill="#1a2350"/>
    <ellipse cx="106" cy="125" rx="4.2" ry="2.2" fill="#6a78bf" opacity=".85"/>
    <path d="M88 141 Q110 175 132 141 Q110 151 88 141 Z" fill="#1a1030"/>
    <ellipse cx="110" cy="156" rx="9" ry="4.2" fill="#ff8fb0"/>
  </g>
</svg>
