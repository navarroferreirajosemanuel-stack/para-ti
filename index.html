<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2666">
  <meta name="description" content="Hay algo para ti... abre la carta.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hay algo para ti 💛">
  <meta property="og:description" content="Una carta con sorpresa. Ábrela.">
  <title>Hay algo para ti 💛</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<main class="stage" id="stage" data-state="closed">

  <!-- Fondo: degradado + estrellas y corazones (los crea script.js) -->
  <div class="bg" id="bg" aria-hidden="true"></div>

  <!-- ===== 1. Sobre cerrado ===== -->
  <section class="intro" id="intro">
    <div class="env-group" id="envelope" aria-hidden="true">
      <div class="envelope">
        <div class="env-back"></div>
        <div class="env-paper"></div>

        <div class="env-front">
          <svg viewBox="0 0 140 100" preserveAspectRatio="none" focusable="false">
            <path d="M0 0 L70 56 L0 100 Z" fill="#ffe6a6"/>
            <path d="M140 0 L70 56 L140 100 Z" fill="#ffdf94"/>
            <path d="M0 100 L70 50 L140 100 Z" fill="#ffd36f"/>
            <path d="M0 0 L70 56 L140 0 M0 100 L70 50 L140 100" fill="none" stroke="#e2ae3f" stroke-width=".7" opacity=".7"/>
          </svg>
        </div>

        <div class="env-flap">
          <svg viewBox="0 0 140 56" preserveAspectRatio="none" focusable="false">
            <path class="flap-path" d="M0 0 H140 L70 56 Z"/>
          </svg>
        </div>

        <div class="seal">
          <svg viewBox="0 0 48 48" focusable="false">
            <circle cx="24" cy="24" r="22" fill="#3f68d4"/>
            <circle cx="24" cy="24" r="17.5" fill="none" stroke="#7da3f6" stroke-width="1.4" stroke-dasharray="2 3"/>
            <path d="M24 35 C 12 27 13 17 19.5 16.4 C 22 16.2 23.4 17.6 24 19.2 C 24.6 17.6 26 16.2 28.5 16.4 C 35 17 36 27 24 35Z" fill="#ffe7a3"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="intro-copy">
      <p class="hint" id="hint">Hay algo para ti...</p>
      <button class="btn btn-open" id="openBtn" type="button">Abrir carta</button>
    </div>
  </section>

  <!-- ===== 2. La carta abierta ===== -->
  <div class="letter-wrap">
    <article class="letter" id="letter" tabindex="-1" aria-label="Carta de Feliz Día del Amor y la Amistad">

      <!-- brillos (aparecen primero) -->
      <div class="sparkles" aria-hidden="true">
        <i style="--x:9%;  --y:8%;  --s:16px; --d:.05s"></i>
        <i style="--x:82%; --y:6%;  --s:12px; --d:.20s"></i>
        <i style="--x:47%; --y:3%;  --s:10px; --d:.35s"></i>
        <i style="--x:92%; --y:30%; --s:16px; --d:.15s"></i>
        <i style="--x:4%;  --y:34%; --s:12px; --d:.40s"></i>
        <i style="--x:20%; --y:52%; --s:10px; --d:.55s"></i>
        <i style="--x:88%; --y:56%; --s:12px; --d:.30s"></i>
        <i style="--x:12%; --y:74%; --s:14px; --d:.45s"></i>
        <i style="--x:93%; --y:78%; --s:10px; --d:.60s"></i>
        <i style="--x:70%; --y:16%; --s:9px;  --d:.50s"></i>
      </div>

      <div class="letter-inner">
        <!-- ramo + personaje -->
        <div class="scene">
          <div class="bouquet">
            <img src="./assets/bouquet.svg" alt="Un ramo grande de flores amarillas" width="300" height="400" decoding="async">
          </div>
          <div class="stitch">
            <img src="./assets/stitch.svg" alt="Un pequeño alienígena azul que saluda con una flor" width="220" height="300" decoding="async">
          </div>
        </div>

        <!-- ===== TEXTOS: edítalos aquí ===== -->
        <div class="text">
          <h1 class="title">
            <span class="line">Feliz Día del</span>
            <span class="line">Amor y la Amistad <span class="heart">💛</span></span>
          </h1>
          <p class="subtitle">Espero que tengas un día muy bonito&nbsp;✨</p>
          <button class="btn btn-ghost" id="replayBtn" type="button">Volver a abrir</button>
        </div>
      </div>
    </article>
  </div>

  <!-- pétalos que caen (los crea script.js) -->
  <div class="fx" id="fx" aria-hidden="true"></div>

  <!-- sonido opcional: nunca se reproduce solo -->
  <button class="sound" id="soundBtn" type="button" aria-pressed="false" aria-label="Activar sonido">
    <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" focusable="false" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
      <path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" focusable="false" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
      <path d="M16 9.5a4 4 0 010 5M18.5 7a7.5 7.5 0 010 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <noscript><p class="noscript">Para abrir la carta necesitas activar JavaScript en tu navegador.</p></noscript>
</main>

<script src="./script.js"></script>
</body>
</html>
